# listenrr satellite — example ESPHome configuration (milestone S1.5 of the original
# design plan, not published)
#
# ===========================================================================
# EXAMPLE — REFERENCE BOARD. COMPILES; NOT BOOTED.
# ===========================================================================
#
# This is the example configuration for the reference satellite, the
# **Waveshare ESP32-S3-AUDIO** board. It replaced, in place, the retired
# devkit example (INMP441 microphone + MAX98357A amplifier). That hardware was
# never bought, never flashed and never streamed a sample; nothing below
# describes it.
#
# This file compiles (record below) but nobody has booted it. A compile proves
# the option names, the component wiring and the repo-local luna_stream
# component are valid; it proves nothing about the hardware. It is written from
# running configurations of the same board, cited inline. Where a value is
# genuinely unknown it is marked UNKNOWN and left unset rather than guessed.
#
# The board: ESP32-S3R8 (8 MB in-package octal PSRAM, 16 MB flash), ES8311
# playback codec feeding an NS4150B Class-D amplifier, ES7210 four-channel mic
# ADC, TCA9555 I2C expander (amp enable + three keys), 7 x WS2812 status ring.
# Both codecs sit on ONE I2S bus — see the audio section below, which is the
# part that changes the device design rather than just the pins.
#
# Pins, addresses and the two proven bus layouts come from three sources, cited
# inline by tag:
#   [design]  the original design plan, not published: its §1 "Reference hardware".
#   [vendor]  the vendor reference package,
#             github.com/MichalZaniewicz/esphome-waveshare-esp32-s3-audio-va —
#             the config actually flashed on the reference boards. Where a value
#             below is a *default*, it comes from that package's fully merged
#             render (the "validated render" cited below), not from this repo.
#   [pilot]   a minimal standalone config for this board with the same ES7210
#             mic path.
#
# The protocol lives in src/proto.rs; nothing here re-decides it. Two bindings
# are worth knowing before you edit:
#   * "For you" below is the missed-wake trigger. The firmware sends the
#     `save_buffer` event, never `button` — the backend writes that source's
#     last 10 s to clips/missed/. Do not convert it to a generic button.
#   * Any other button you add calls emit_button("<name>") and arrives as
#     {"type":"button","name":"<name>"}.
#
# Compile record, 2026-11-02: `esphome compile config/satellite.example.yaml`
# exits 0 on both ESPHome 2026.9.1 (`nix shell nixpkgs#esphome`, ESP-IDF 5.5.5)
# and 2026.10.1 (the version the reference fleet is flashed with; run from the upstream git tag,
# ESP-IDF 5.5.6), each under a 32 GiB systemd-run memory cap. Both logs show
# luna_stream.cpp.obj, es7210.cpp.obj, es8311.cpp.obj, tca9555.cpp.obj and
# speaker_media_player.cpp.obj each built once; 0 errors, 2 warnings, both in
# third-party opus code, none in luna_stream.
#   2026.9.1   flash 1,154,803 B = 14.2 % of an 8,126,464 B app partition
#              (itself the evidence that flash_size: 16MB took effect),
#              RAM 118,939 B = 34.8 %   (ninja reached [1291/1294])
#   2026.10.1  flash 1,144,367 B = 14.1 %, RAM 118,199 B = 34.6 %
#              (ninja reached [1268/1272])
# These are the reference board's figures; the retired devkit's (1,126,499 B /
# 117,559 B, in docs/design/CONTRACT-NOTES.md) do not apply. Limits of this record: the
# build directory was reused rather than emptied first, and nothing has been
# booted — a compile says nothing about the hardware. The [design] floor is 2026.8.0.
# Re-validate with:
#   esphome compile config/satellite.example.yaml
# Added after the record above, on 2026-11-03: the `ack` earcon playback
# (media_out `files:` + on_earcon), the AC2 `i2c_scan_report` script with its
# on_boot/on_connected hooks, and the luna_stream `on_connected` trigger. They
# are uncompiled by the numbers above — re-run the command before quoting
# them. The earcon adds ~6.5 KiB of embedded WAV plus the WAV decoder.
# It needs a local config/secrets.yaml with wifi_ssid, wifi_password, api_key,
# ota_password and luna_token; this version of the CLI has no --secret flag.
# Note that `min_version` below is 2026.8.0 [vendor]: the tca9555 component
# and the es8311/es7210 audio components this board needs are not in older
# ESPHome releases.
# What compiling still cannot check is the hardware itself — see the two
# UNKNOWN blocks below (echo-reference slot, LED colour order).

substitutions:
  name: luna-satellite-kitchen
  friendly_name: Kitchen satellite
  backend_host: 192.168.1.30
  backend_port: "10700"
  source_id: kitchen
  room: kitchen

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # 2026.8.0, not the devkit file's 2024.6.0: `tca9555`, `audio_dac: es8311`
  # and `audio_adc: es7210` do not exist in older releases [vendor].
  min_version: "2026.8.0"
  # AC2's boot-half report (the reconnect half is on_connected below). The
  # priority is load-bearing: StartupTrigger's setup() runs AT the given
  # priority (core/base_automation.h), so -100 == setup_priority::LATE, i.e.
  # after every component's setup() — the i2c bus (BUS = 1000), both codecs
  # and this file's luna_stream (AFTER_WIFI = 200). Any higher and the report
  # could probe a bus that has not been initialised yet.
  on_boot:
    priority: -100
    then:
      - script.execute: i2c_scan_report
      # Push the restored gain into the ES7210: the codec boots with `mic_gain` from
      # audio_adc, and a saved number would otherwise show in HA while the hardware sat at the
      # default (see the `number:` block).
      - lambda: |-
          id(adc_mic).set_mic_gain(id(mic_gain_db).state);
          ESP_LOGI("luna.mic", "restored mic gain %.1f dB", id(mic_gain_db).state);

esp32:
  # Same board id the working configs use for this hardware — it is a
  # generic S3 target, not a custom board definition [vendor] [pilot].
  board: esp32-s3-devkitc-1
  variant: esp32s3
  # 16 MB flash (W25Q128JVSI) [design] [vendor].
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

# 8 MB in-package octal PSRAM (ESP32-S3R8) [design] [vendor] [pilot]. The
# transmit queue and the audio staging live there, and the LED strip driver
# allocates there too.
psram:
  mode: octal
  speed: 80MHz

# The component is in this repo, next to the backend.
external_components:
  - source:
      type: local
      path: ../firmware/components
    components: [luna_stream]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Continuous 64 ms frames: modem sleep adds hundreds of ms of jitter and
  # shows up as seq gaps in the backend's gap log. Keep it off.
  power_save_mode: none

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ---------------------------------------------------------------------------
# I2C: one bus, four devices (ES8311 0x18, ES7210 0x40, TCA9555 0x20, RTC).
# GPIO10/GPIO11, and the schematic marks those nets I2C-only [design] [vendor].
# `scan: true` is not decoration: AC2 requires both codec addresses to answer
# an I2C scan at boot and after every reconnect, because a mis-initialised
# ES7210 still emits perfectly sequenced frames of silence. ESPHome prints
# its own scan once, in the bus component's setup(); the report that
# satisfies AC2 — once after setup and after every backend connection, from
# the same zero-length probe — is `script: i2c_scan_report` below.
# ---------------------------------------------------------------------------
i2c:
  - id: internal_i2c
    sda: GPIO11
    scl: GPIO10
    scan: true
    frequency: 100kHz

# Amplifier enable and the three user keys live here, not on GPIOs [design].
# No GPIO is spent on them, which is also why the ES8311's own `pa_pin` is
# unused on this board (the vendor demo sets it to -1) [design].
tca9555:
  id: ioexp
  i2c_id: internal_i2c
  address: 0x20

# ---------------------------------------------------------------------------
# AC2's presence report: one line, tag luna.i2c, at the end of setup
# (esphome.on_boot above) and after every backend (re)connection
# (luna_stream.on_connected below).
#
# Why a report at all: ESPHome's own scan runs once inside the i2c
# component's setup(), so it is gone from the log long before anyone attaches
# a console — and a mis-initialised ES7210 still emits perfectly sequenced
# frames of silence, so healthy-looking audio is not evidence the codec ever
# answered I2C. The only observable that separates those two worlds is a
# probe, so this re-answers the scan question on demand.
#
# The probe is `I2CBus::write_readv(addr, nullptr, 0, nullptr, 0)` — the
# exact zero-length transaction i2c_scan_() itself uses
# (components/i2c/i2c.cpp), i.e. the same START-address-STOP the boot scan
# printed. Safe to run while the codecs are streaming: I2C is not on the
# audio path (the codecs are configured once at setup and then clock
# samples over I2S), the ESP-IDF driver serialises each transaction against
# any concurrent user of the bus, and four address-only phases at 100 kHz
# are microseconds of bus time. Thread-wise it runs on the ESPHome main
# loop — both callers (the on_boot trigger, and luna_stream firing
# on_connected from its loop()) are main-loop contexts; the microphone
# capture task never reaches this code.
# ---------------------------------------------------------------------------
script:
  - id: i2c_scan_report
    mode: single  # a second concurrent report would repeat the same four probes
    then:
      - lambda: |-
          // ES8311 0x18, TCA9555 0x20, ES7210 0x40 = AC2's required set;
          // the RTC at 0x51 is reported but not required [design]. PROBED is
          // ascending, so the found list is too.
          static const uint8_t PROBED[] = {0x18, 0x20, 0x40, 0x51};
          static const uint8_t REQUIRED[] = {0x18, 0x20, 0x40};
          auto *bus = id(internal_i2c);
          bool present[sizeof(PROBED)];
          for (size_t i = 0; i < sizeof(PROBED); i++) {
            present[i] = bus->write_readv(PROBED[i], nullptr, 0, nullptr, 0) == i2c::ERROR_OK;
          }
          char found[40];
          size_t found_len = 0;
          found[0] = '\0';
          for (size_t i = 0; i < sizeof(PROBED); i++) {
            if (present[i]) {
              found_len += (size_t) snprintf(found + found_len, sizeof(found) - found_len, " 0x%02X", PROBED[i]);
            }
          }
          char missing[40];
          size_t missing_len = 0;
          missing[0] = '\0';
          bool all_present = true;
          for (const uint8_t addr : REQUIRED) {
            bool ok = false;
            for (size_t i = 0; i < sizeof(PROBED) && !ok; i++) {
              ok = present[i] && PROBED[i] == addr;
            }
            if (!ok) {
              all_present = false;
              missing_len += (size_t) snprintf(missing + missing_len, sizeof(missing) - missing_len, " 0x%02X", addr);
            }
          }
          if (all_present) {
            ESP_LOGI("luna.i2c", "i2c scan:%s | required 0x18 0x20 0x40: PASS", found);
          } else {
            ESP_LOGE("luna.i2c", "i2c scan:%s | required 0x18 0x20 0x40: FAIL missing%s", found, missing);
          }

  # A brief blue flash at the chosen brightness whenever the LED brightness slider moves, so the
  # setting can be judged by eye. `restart`: dragging the slider re-arms the same flash instead
  # of stacking them. It turns the ring off at the end, so moving the slider mid-conversation
  # would end that ring early; that is rare enough not to be worth a state machine.
  - id: led_preview
    mode: restart
    then:
      - light.turn_on:
          id: status_led
          red: 0.0
          green: 0.31
          blue: 1.0
          brightness: !lambda 'return id(led_brightness).state;'
      - delay: 1.2s
      - light.turn_off: status_led

# ---------------------------------------------------------------------------
# Audio. Both codecs share BCLK/GPIO13 and LRCK/GPIO14 but need separate ESP32
# I2S ports, because ESPHome's i2s_audio cannot run one bus full-duplex: each
# side calls i2s_new_channel on the port and the second one fails with
# "Parent bus is busy" [design].
#
# LAYOUT (a) from [design], i.e. the one the *working* config uses: two bus ids
# over the shared clock pins with allow_other_uses, the microphone bus as I2S
# master (it is always capturing, so it drives the clock) and the speaker bus
# as `secondary`, reading that clock. Both codecs stay stock; no patched ES8311
# and no force_master. Taken from the audio section of [vendor], not inferred.
#
# Layout (b) in [design] — both sides secondary with ES8311 forced clock master
# — needs changes to stock ESPHome, so it is not used here.
# ---------------------------------------------------------------------------
i2s_audio:
  - id: i2s_input
    i2s_mclk_pin: GPIO12
    i2s_bclk_pin:
      number: GPIO13
      allow_other_uses: true
    i2s_lrclk_pin:
      number: GPIO14
      allow_other_uses: true
  - id: i2s_output
    i2s_bclk_pin:
      number: GPIO13
      allow_other_uses: true
    i2s_lrclk_pin:
      number: GPIO14
      allow_other_uses: true

# Playback codec. I2C address 0x18 is the driver default [vendor validated
# render: "address": 24]; the working config does not set it, so it is not set
# here either — the I2C scan above is what proves the part answered.
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: internal_i2c

# Mic ADC. 16-bit / 16 kHz is the driver default [vendor validated render],
# made explicit because the contract is 16 kHz and AC3's cost figures are a
# claim about that rate. 0x40 is likewise the driver default ("address": 64);
# `mic_gain: 24db` is the value the working config runs (3 dB register steps)
# [vendor] [pilot].
audio_adc:
  - platform: es7210
    id: adc_mic
    i2c_id: internal_i2c
    mic_gain: 36db

# Capture. The contract is fixed at 16 kHz mono 16-bit signed LE, 1024 samples
# per frame; the component requests exactly that from its MicrophoneSource.
#
# `bits_per_sample: 16bit` is load-bearing, not tidiness: as I2S master the mic
# defines the frame's slot width and the i2s_audio default is 32-bit, which
# doubles the bit clock the 16-bit ES8311 expects — playback then presents as
# noise rather than as an error, and the keyword spotter is starved. The whole
# bus is 16-bit (ES7210 included) when this matches [vendor] [pilot] [design].
#
# `channel` is deliberately NOT set: the working config leaves it at the tool
# default, which the validated render shows resolving to "right" — and which
# physical ES7210 input that is, is the UNKNOWN below.
microphone:
  - platform: i2s_audio
    id: mic_i2s
    i2s_audio_id: i2s_input
    # ES7210 -> ESP [design] [vendor].
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit

# UNKNOWN — ES7210 echo-reference slot. NOT resolved here; do not read any
# value above as an answer.
#
#   The ES7210 has four inputs and one of them carries the amplifier loopback
#   used as an AEC reference. The schematic says the loopback is wired to MIC3;
#   the vendor demo's AFE input format string is "RMNM", i.e. slot 0 is the
#   reference. Neither source documents how those slots pack into the stream,
#   so which physical input ends up where is [UNKNOWN: which physical input
#   carries the echo reference in the demo's packed stream].
#
#   Candidate answers, with sources:
#     (i)  MIC3 (schematic, ESP32-S3-AUDIO-Board_1.1.pdf) — the reference is on
#          one of the later slots.
#     (ii) slot 0 (vendor demo, AFE format "RMNM") — the reference is first.
#
#   This reaches AC6: whichever slot the firmware sends upstream is literally
#   the signal the SNR arbitration compares, so it has to be pinned by capture
#   (and recorded in the clip sidecar) before any AEC or SNR-arbitration code
#   is written. Configuring it "the way it probably is" would bake a guess into
#   the one place the measurement depends on.

# Playback. The ES8311 is a slave to the mic bus's clock, so this side is
# `secondary`; `timeout: never` and `buffer_duration: 100ms` are the working
# config's values [vendor]. The ES8311's `pa_pin` is left unset/unused on
# purpose: the amplifier is gated on TCA9555 EXIO8 below, not on a GPIO [design].
#
# Rate/clocking on this slave side, all matching the bus the mic masters:
# `sample_rate` is NOT set — it resolves to 16000, the value the working
# config's own validated render shows, and anything higher is rejected because
# a slave cannot exceed the clock it is given (see the announcement_pipeline
# note below). `use_apll` is NOT set either; a precision clock source is the
# master's concern and the working config sets neither. `bits_per_sample` is
# pinned to 16bit to match the frame width the mic master defines, and
# `channel: mono` is for the single speaker on the board [vendor].
speaker:
  - platform: i2s_audio
    id: speaker_out
    i2s_audio_id: i2s_output
    i2s_mode: secondary
    dac_type: external
    audio_dac: es8311_dac
    # ESP -> ES8311 [design] [vendor].
    i2s_dout_pin: GPIO16
    bits_per_sample: 16bit
    channel: mono
    timeout: never
    buffer_duration: 100ms

  # The i2s speaker above is an I2S *slave* on the 16 kHz clock the microphone
  # masters, and it rejects any stream at another rate ("Incompatible stream
  # settings", retried forever, nothing audible). Home Assistant TTS arrives
  # at 24 or 44.1 kHz and the announcement pipeline hands the decoded stream
  # straight to whatever speaker it is given, so something has to resample.
  # The fleet's config does the same with its resampler speakers [vendor]; the
  # mixer in front of them is not needed here (announcements only).
  - platform: resampler
    id: announcement_resampler
    output_speaker: speaker_out

# NS4150B speaker amplifier, enabled through the expander: TCA9555 EXIO8,
# active-high (hence inverted: false), not a GPIO [design] [vendor]. Off at
# boot — the working config keeps it off so it does not amplify the undriven
# DAC line as hiss [vendor].
switch:
  - platform: gpio
    id: amp_enable
    name: ${friendly_name} Amplifier
    icon: mdi:speaker
    entity_category: config
    pin:
      tca9555: ioexp
      number: 8
      inverted: false
    restore_mode: ALWAYS_OFF

# HA plays TTS here (media_player.play_media with announce: true). Reaching
# idle is what emits the `playback_done` event that ends the backend's
# Speaking state, so this must be wired to luna_stream below.
#
# The i2s_audio media_player platform was removed; announcements now go through
# a pipeline on the speaker, and the amplifier's pins live in the switch block
# above, not here — repeating them here is not possible anymore.
media_player:
  - platform: speaker
    id: media_out
    name: ${friendly_name}
    # The ES8311 maps 0.75 to 0 dB and 0.5 to about -31 dB, so the ESPHome default of
    # 0.5 starts a fresh board nearly inaudible. The restored value (HA or the
    # volume keys) takes over after the first boot.
    volume_initial: 0.75
    announcement_pipeline:
      speaker: announcement_resampler
      # FLAC, as the fleet declares [vendor]: Home Assistant reads the format a
      # media player advertises and transcodes whatever it plays to it, so TTS
      # (an mp3) reaches this board as FLAC. Measured on the bedroom board with
      # the same sentence, 75 % volume, heard by the board's own microphone:
      # as raw mp3 (this line was `format: NONE`) the loudest 200 ms was
      # -50 dBFS, barely above the -52 floor and "so quiet" by ear; with HA
      # transcoding it is -20 dBFS and loud. The mechanism is NOT established
      # here (a test that blamed the on-device mp3 decoder used a tone that was
      # itself 18 dB quieter and proved nothing); the measurement is.
      format: FLAC
      # 16000: the shared I2S bus runs at the microphone's 16 kHz and the
      # slave speaker cannot be asked for more ("The sample_rate value must be
      # at most 16000"). The decoded stream is NOT resampled by the pipeline
      # itself, it goes straight to `speaker:`; the resampler speaker named
      # above is what converts it to this rate. An earlier version of this
      # file pointed the pipeline at `speaker_out` directly and said the
      # resampler was unnecessary. That was wrong: on the board the speaker
      # rejected every TTS stream and nothing was ever audible.
      sample_rate: 16000
      num_channels: 1
    # Local audio, embedded into flash at compile time (the audio_file
    # machinery turns the WAV into a PROGMEM array — 200 ms at this rate is
    # 6.4 KiB, noise against the 14 % app usage in the header record).
    # `file:` resolves relative to this file's directory, so the asset lives
    # at config/sounds/ack.wav; regenerate it with config/sounds/make_ack.py
    # rather than editing bytes (same input, byte-identical output).
    # It is embedded, not streamed, for the same reason the chime is quiet:
    # `ack` arrives the instant the user starts speaking, and a wake answer
    # must not wait on — or depend on — the network.
    files:
      - id: ack_earcon
        file: sounds/ack.wav
    # The amp has to follow playback or TTS completes and stays silent — the
    # exact failure AC5 is written to catch ("audible at the device", not a
    # state field). Copied from the working config's on_state: on when
    # announcing or playing, and left on afterwards so there is no per-sound
    # click [vendor].
    on_state:
      - if:
          condition:
            or:
              - media_player.is_announcing:
              - lambda: 'return id(media_out)->state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;'
          then:
            - switch.turn_on: amp_enable

# Status ring: 7 x WS2812 on GPIO38 [design] [vendor]. Driven by luna_stream's
# `on_led` below, so it is internal and needs no HA entity.
#
# CONFIRMED BY EYE (2026-11-03, bedroom board): `channel_colors: RGB` is right.
# The ring showed blue for "listening" and green for "speaking" — the colours the
# backend sends. The paragraphs below are the original reasoning, kept because the
# vendor's own code and comment still contradict each other.
#
# (was) UNKNOWN — WS2812 colour order. UNCONFIRMED, not verified.
#
#   `channel_colors` is a REQUIRED option of esp32_rmt_led_strip in this
#   ESPHome (omitting it fails config validation: "'channel_colors' is
#   required") — which is also what put the 2026.8.0 floor on `min_version`
#   above [vendor]. So a value has to be here; the question is only which
#   one, and that is genuinely unresolved: the vendor's own code says RGB
#   while its own comment says GRB, and both community docs say the only way
#   to settle it is to look at the ring.
#
#   RGB below is therefore BORROWED, not established: it is the value the
#   vendor reference package's merged base core config uses on the reference boards
#   (`channel_colors: RGB`), attributed to that file and to nothing else — not to
#   the vendor, and not to the hardware. Nobody here has checked this ring by
#   eye. Until someone does, the value is unconfirmed: send "listening" and
#   confirm the ring is blue, not red or green, before any colour in the
#   protocol ("blue = listening", "green = speaking", "red = muted") is
#   trusted. A wrong order here does not break anything — it silently maps
#   every colour the backend sends onto a different colour on the device.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: ${friendly_name} LED
    internal: true
    pin: GPIO38
    num_leds: 7
    chipset: WS2812
    # Required option; value borrowed from the vendor reference config (see the
    # UNKNOWN block above). Confirmed RGB on the bedroom board by eye (blue/green).
    channel_colors: RGB

# The three user keys are TCA9555 inputs, active-low, with 10k hardware
# pull-ups — not GPIOs [design] [vendor]. The vendor gives them no named
# function, so the mapping below is this project's choice, not the vendor's:
# EXIO9 is the "for you" missed-wake trigger (AC11), EXIO10/EXIO11 send generic
# buttons. BOOT (GPIO0) and RESET are separate and not used here.
binary_sensor:
  - platform: gpio
    name: ${friendly_name} For you key
    id: for_you_key
    pin:
      tca9555: ioexp
      number: 9
      inverted: true
    on_press:
      - lambda: id(luna_satellite).emit_save_buffer();
  - platform: gpio
    name: ${friendly_name} Key 2
    id: key2
    pin:
      tca9555: ioexp
      number: 10
      inverted: true
    on_press:
      - lambda: id(luna_satellite).emit_button("key2");
  - platform: gpio
    name: ${friendly_name} Key 3
    id: key3
    pin:
      tca9555: ioexp
      number: 11
      inverted: true
    on_press:
      - lambda: id(luna_satellite).emit_button("key3");

button:
  # "That was for you" — the missed-wake capture (AC11). Emits save_buffer.
  # This is the HA-visible twin of the EXIO9 key above; same event, so the
  # trigger survives a dead expander or a re-flashed board.
  - platform: template
    name: ${friendly_name} For you
    id: for_you_button
    icon: mdi:bookmark-plus-outline
    on_press:
      - lambda: id(luna_satellite).emit_save_buffer();
  # A generic button: arrives at the backend as {"type":"button"}.
  - platform: template
    name: ${friendly_name} Night mode
    id: night_mode_button
    icon: mdi:weather-night
    on_press:
      - lambda: id(luna_satellite).emit_button("night_mode");

# Runtime controls, so a room can be tuned from Home Assistant without a reflash. Both are
# restored across reboots. They have plain names on purpose: the device name already prefixes
# the entity id, and the older entities that repeat ${friendly_name} produce ids like
# `..._bedroom_satellite_bedroom_satellite_amplifier`.
number:
  # ES7210 microphone gain. 36 dB is the value this repo settled on after measuring speech at
  # 24 dB (-46 dBFS, below what the VAD reliably registers) and 36 dB (-30 dBFS). The register
  # moves in 3 dB steps up to 33 dB and then 1.5 dB, so 36 is the highest value on the grid [vendor].
  # A restored value is only *published* at boot, never applied (TemplateNumber::setup does not
  # run set_action), which is why on_boot above pushes it into the codec.
  - platform: template
    id: mic_gain_db
    name: Mic gain
    icon: mdi:microphone-settings
    entity_category: config
    unit_of_measurement: dB
    min_value: 0
    max_value: 36
    step: 3
    initial_value: 36
    restore_value: true
    optimistic: true
    mode: slider
    set_action:
      - lambda: id(adc_mic).set_mic_gain(x);
      - logger.log:
          level: INFO  # the action defaults to DEBUG, which this device's INFO logger drops
          format: "mic gain -> %.1f dB"
          args: ["x"]

  # Brightness of the status ring for every colour it shows. The firmware normalises a light's
  # colour to its brightest channel, so intensity can only come from brightness, never from the
  # rgb values. Default 0.5: full brightness on seven WS2812s is a lot in a bedroom at night.
  - platform: template
    id: led_brightness
    name: LED brightness
    icon: mdi:brightness-6
    entity_category: config
    min_value: 0.1
    max_value: 1.0
    step: 0.05
    initial_value: 0.5
    restore_value: true
    optimistic: true
    mode: slider
    set_action:
      - script.execute: led_preview

luna_stream:
  id: luna_satellite
  backend_host: ${backend_host}
  backend_port: ${backend_port}
  # Must match a [[sources]].id in the backend's config, or ingest closes the
  # connection unless server.allow_unknown_sources is set.
  source_id: ${source_id}
  room: ${room}
  # Shared secret: keep it in secrets.yaml, never inline. Compare against
  # server.auth_token on the backend.
  token: !secret luna_token
  # hello `caps`: this satellite has a speaker and no hardware AEC. The board
  # does have an amplifier loopback into the ES7210, but nothing in this
  # firmware uses it (see the echo-reference UNKNOWN above).
  has_speaker: true
  has_aec: false
  firmware_version: "0.1.0"
  microphone: mic_i2s
  media_player: media_out
  # ~1 s of audio (16 x 64 ms) to ride out a short network stall; ~33 KiB.
  frame_buffer_frames: 16
  rx_buffer_bytes: 512

  # Downlink {"type":"led","state":"..."} — the four states the protocol
  # defines. Anything else is dropped by the decoder, so these branches are
  # the complete set.
  on_led:
    - lambda: |-
        ESP_LOGI("luna.led", "led state: %s", state.c_str());
        // Off is turn_off(), never rgb(0,0,0): ESPHome's normalize_color() maps an
        // all-zero colour to (1,1,1), i.e. full white, which is what the ring showed
        // when a session ended. It also normalises every colour to max = 1, so the
        // rgb magnitudes below only choose a hue; intensity is the brightness.
        float r = 0.0f, g = 0.0f, b = 0.0f, level = 1.0f;
        if (state == "listening") {
          g = 0.31f; b = 1.0f;   // blue: wake detected, capturing
        } else if (state == "speaking") {
          g = 1.0f;              // green: TTS playing
        } else if (state == "muted") {
          r = 1.0f; level = 0.47f;   // dim red: muted / suppressed
        } else {
          id(status_led).turn_off().perform();   // "idle": the decoder drops anything else
          return;
        }
        auto call = id(status_led).turn_on();
        call.set_rgb(r, g, b);
        call.set_brightness(level * id(led_brightness).state);
        call.perform();

  # Downlink {"type":"earcon","name":"..."}. Every name logs first — that
  # line is what proved the downlink works before anything was audible — and
  # unknown names are nothing else: no branch plays for them.
  #
  # `ack` (sent by the backend on wake) is played from flash via `files:`
  # above. Two properties are deliberate and were the point of the exercise:
  #   * The chime is ~200 ms and peaks at -12 dBFS (make_ack.py): it fires
  #     while the user is already speaking, so it must sit under their first
  #     words, and — being 200 ms of a two-note pattern rather than speech —
  #     it cannot be mistaken for wake audio by anyone (the mic keeps
  #     streaming through it; the backend's VAD is not gated by playback).
  #   * `announcement: true` routes it through media_out's announcement
  #     pipeline, exactly like TTS: that is the pipeline that resamples into
  #     the 16 kHz slave speaker, and reaching it flips media_out to
  #     ANNOUNCING — the state the on_state hook above keys amp_enable on.
  #     The amp is therefore on for the chime without this block touching the
  #     switch; on a cold board the amp turns on in the same event as the
  #     playback request, ahead of any audible samples.
  on_earcon:
    - lambda: |-
        ESP_LOGI("luna.earcon", "earcon requested: %s", name.c_str());
    - if:
        condition:
          lambda: 'return name == "ack";'
        then:
          - media_player.speaker.play_on_device_media_file:
              id: media_out
              media_file: ack_earcon
              announcement: true

  # AC2's reconnect half: a healthy-looking stream is not evidence the ES7210
  # was ever configured (silence comes out of it in perfect sequence), so the
  # three control addresses must answer after every (re)connection too. The
  # component fires this from loop() — the main loop — which is exactly where
  # the script's bus probes have to run; the microphone capture task never
  # reaches here.
  on_connected:
    - script.execute: i2c_scan_report
