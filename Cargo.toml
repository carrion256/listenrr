[package]
name = "listenrr"
version = "0.1.0"
edition = "2021"
description = "Luna voice backend: central wake detection, capture, verify gate and Home Assistant Assist entry"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crossbeam-channel = "0.5"
sherpa-onnx = "2.0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
hound = "3.5"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
